name: Export Source Snapshot

on:
  push:
    branches:
      - tmp/export-phase1-source

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/claude-native-multi-codex-phase-1
          fetch-depth: 0
      - name: Package source
        run: git archive --format=tar.gz -o source.tar.gz HEAD
      - name: Upload source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-plugin-cc-phase1-source
          path: source.tar.gz
          retention-days: 1
