name: Export Source Snapshot

on:
  push:
    branches:
      - tmp/export-phase1-source

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: git archive --format=tar.gz -o source.tar.gz HEAD
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: codex-plugin-cc-source
          path: source.tar.gz
          retention-days: 1
