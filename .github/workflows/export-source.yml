name: Clean Phase 1 README Once

on:
  push:
    branches:
      - tmp/export-phase1-source

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/claude-native-multi-codex-phase-1
          fetch-depth: 0

      - name: Remove duplicate README section
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          source = path.read_text(encoding="utf-8")
          marker = "\n## Claude-native Multi-Codex orchestration\n"
          if source.count(marker) != 1:
              raise RuntimeError(f"Expected one duplicate marker, found {source.count(marker)}")
          path.write_text(source[:source.index(marker)].rstrip() + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: remove duplicate Phase 1 overview"
          git push origin HEAD:refs/heads/feat/claude-native-multi-codex-phase-1
