name: Repair and Merge Phase 1 Once

on:
  push:
    branches:
      - feat/claude-native-multi-codex-phase-1

permissions:
  contents: write

concurrency:
  group: implement-phase1-once
  cancel-in-progress: false

jobs:
  repair-verify-merge:
    if: ${{ !contains(github.event.head_commit.message, '[phase1-repair-debug]') && !contains(github.event.head_commit.message, 'feat: implement read-only Multi-Codex orchestration') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out latest feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: feat/claude-native-multi-codex-phase-1

      - name: Refresh latest remote feature state
        shell: bash
        run: |
          git fetch origin feat/claude-native-multi-codex-phase-1
          git reset --hard origin/feat/claude-native-multi-codex-phase-1

      - name: Generate implementation when needed
        shell: bash
        run: |
          set -o pipefail
          : > .phase1-repair-failure.log
          {
            if [[ ! -s plugins/codex/scripts/orchestration/controller.mjs ]]; then
              python3 scripts/apply-phase1-implementation-once.py
              python3 scripts/apply-phase1-implementation-once-part2.py
              python3 scripts/apply-phase1-implementation-once-part3.py
            fi
            python3 scripts/repair-phase1-command-compat.py
          } 2>&1 | tee -a .phase1-repair-failure.log

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install and verify
        shell: bash
        run: |
          set -o pipefail
          {
            npm ci
            npm install -g @openai/codex
            npm run check-version
            npm test
            npm run build
            git diff --check
          } 2>&1 | tee -a .phase1-repair-failure.log

      - name: Verify Phase 1 structure and safety boundary
        shell: bash
        run: |
          set -euo pipefail
          for required in \
            plugins/codex/scripts/orchestration/controller.mjs \
            plugins/codex/scripts/orchestration/controller-server.mjs \
            plugins/codex/scripts/orchestration/package-worker.mjs \
            plugins/codex/scripts/orchestration/worker-pool.mjs \
            plugins/codex/scripts/orchestration/state-store.mjs \
            plugins/codex/scripts/orchestration/cli.mjs \
            plugins/codex/commands/orchestrate.md \
            plugins/codex/skills/codex-orchestration/SKILL.md \
            tests/orchestration-contracts.test.mjs; do
            test -s "$required" || { echo "Missing $required" | tee -a .phase1-repair-failure.log; exit 61; }
          done
          if git grep -nE 'sandbox:[[:space:]]*["'"'"'`]danger-full-access|git worktree add|refs/codex-orchestration/snapshots' -- plugins/codex/scripts/orchestration; then
            echo "Phase 2/3 write implementation leaked into Phase 1." | tee -a .phase1-repair-failure.log
            exit 62
          fi

      - name: Commit verified tree and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .phase1-ci-failure.log .phase1-repair-failure.log
          rm -f scripts/apply-phase1-implementation-once.py
          rm -f scripts/apply-phase1-implementation-once-part2.py
          rm -f scripts/apply-phase1-implementation-once-part3.py
          rm -f scripts/repair-phase1-command-compat.py
          rm -f .github/workflows/apply-phase1-implementation-once.yml
          rm -f .github/workflows/implement-phase1-once.yml
          rm -f .github/workflows/repair-phase1-once.yml
          rm -rf .phase1-upload .github/phase1-upload
          find . -maxdepth 2 -type f \
            \( -name 'phase1-implementation*.part*' \
            -o -name 'phase1-implementation*.patch*' \
            -o -name 'phase1-upload*.txt' \
            -o -name '__schema_probe_should_not_exist__' \
            -o -name '__do_not_commit__' \) -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement read-only Multi-Codex orchestration"
          git push origin HEAD:refs/heads/feat/claude-native-multi-codex-phase-1
          git push origin HEAD:refs/heads/main

      - name: Preserve repair diagnostics on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f .phase1-repair-failure.log || echo "Repair workflow failed before diagnostics were created." > .phase1-repair-failure.log
          git add .phase1-repair-failure.log
          git commit -m "chore: preserve Phase 1 repair failure [phase1-repair-debug]"
          git push origin HEAD:refs/heads/feat/claude-native-multi-codex-phase-1
