name: Export Node Modules

on:
  push:
    branches:
      - tmp/export-phase1-source

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: tar -czf node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: node-modules
          path: node-modules.tar.gz
          retention-days: 1
