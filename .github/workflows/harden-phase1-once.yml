name: Harden and Merge Phase 1 Once

on:
  push:
    branches:
      - feat/claude-native-multi-codex-phase-1

permissions:
  contents: write

concurrency:
  group: harden-phase1-once
  cancel-in-progress: false

jobs:
  harden-verify-merge:
    if: ${{ !contains(github.event.head_commit.message, '[phase1-hardening-debug]') && !contains(github.event.head_commit.message, 'fix: harden read-only Multi-Codex orchestration') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out latest feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: feat/claude-native-multi-codex-phase-1

      - name: Refresh latest remote feature state
        shell: bash
        run: |
          git fetch origin feat/claude-native-multi-codex-phase-1
          git reset --hard origin/feat/claude-native-multi-codex-phase-1

      - name: Apply runtime hardening
        shell: bash
        run: |
          set -o pipefail
          : > .phase1-hardening-failure.log
          python3 scripts/harden-phase1-once.py 2>&1 | tee -a .phase1-hardening-failure.log

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install and verify
        shell: bash
        run: |
          set -o pipefail
          {
            npm ci
            npm install -g @openai/codex
            npm run check-version
            npm test
            npm run build
            git diff --check
          } 2>&1 | tee -a .phase1-hardening-failure.log

      - name: Verify lifecycle coverage and Phase 1 safety boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'runAppServerTurnWithClient' plugins/codex/scripts/lib/codex.mjs
          grep -q 'turn/interrupt' plugins/codex/scripts/orchestration/package-worker.mjs
          grep -q 'reconcilePhase1ControllerLoss' plugins/codex/scripts/orchestration/controller-server.mjs
          grep -q 'runs independent Codex Roots concurrently' tests/orchestration-runtime.test.mjs
          grep -q 'soft turn interrupt' tests/orchestration-runtime.test.mjs
          if git grep -nE 'sandbox:[[:space:]]*["'"'"'`]danger-full-access|git worktree add|refs/codex-orchestration/snapshots' -- plugins/codex/scripts/orchestration; then
            echo "Phase 2/3 write implementation leaked into Phase 1." | tee -a .phase1-hardening-failure.log
            exit 71
          fi

      - name: Commit verified hardening and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .phase1-hardening-failure.log scripts/harden-phase1-once.py .github/workflows/harden-phase1-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden read-only Multi-Codex orchestration"
          git push origin HEAD:refs/heads/feat/claude-native-multi-codex-phase-1
          git push origin HEAD:refs/heads/main

      - name: Preserve hardening diagnostics on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f .phase1-hardening-failure.log || echo "Hardening workflow failed before diagnostics were created." > .phase1-hardening-failure.log
          git add .phase1-hardening-failure.log
          git commit -m "chore: preserve Phase 1 hardening failure [phase1-hardening-debug]"
          git push origin HEAD:refs/heads/feat/claude-native-multi-codex-phase-1
